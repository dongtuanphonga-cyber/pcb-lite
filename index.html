<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arduino Circuit Studio Ultimate - Fixed LED Glow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
            overflow: hidden;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .canvas-grid {
            background-color: #f8fafc;
            background-image: 
                linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .pin {
            width: 14px; height: 14px;
            background: #1e293b;
            border: 2px solid #ffffff;
            border-radius: 4px;
            position: absolute;
            z-index: 35;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            transition: transform 0.12s, background-color 0.12s;
        }
        .pin::after {
            content: ''; position: absolute;
            top: -8px; bottom: -8px; left: -8px; right: -8px;
        }
        .pin:hover, .pin.pin-active {
            transform: scale(1.5);
            background: #10b981;
            border-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px #10b981;
            z-index: 50;
        }
        .pin-tag {
            position: absolute;
            bottom: 17px; left: 50%;
            transform: translateX(-50%);
            background: #0f172a; color: #fff;
            font-size: 10px; font-weight: 700;
            padding: 2px 6px; border-radius: 4px;
            white-space: nowrap; pointer-events: none;
            opacity: 0; transition: opacity 0.12s;
            z-index: 60;
        }
        .pin:hover .pin-tag, .pin.pin-active .pin-tag, .show-all-pins .pin-tag {
            opacity: 1;
        }
        /* Hiệu ứng hào quang đèn LED siêu sáng cho Mobile */
        @keyframes glow-pulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.12); opacity: 1; }
        }
        .led-halo {
            animation: glow-pulse 0.8s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spin-anim { animation: spin 0.3s linear infinite; transform-origin: center; }
        @keyframes smoke-anim {
            0% { transform: translateY(0) scale(0.8); opacity: 0.9; }
            100% { transform: translateY(-45px) scale(2.4); opacity: 0; }
        }
        .smoke-cloud {
            position: absolute; width: 28px; height: 28px;
            background: radial-gradient(circle, rgba(51,65,85,0.95) 0%, rgba(51,65,85,0) 70%);
            border-radius: 50%; pointer-events: none;
            animation: smoke-anim 1.1s infinite; z-index: 55;
        }
        /* Hiệu ứng dòng điện chạy trên dây */
        @keyframes wire-flow {
            to { stroke-dashoffset: -20; }
        }
        .wire-active {
            stroke-dasharray: 6, 4;
            animation: wire-flow 0.4s linear infinite;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

}

void loop() {

    </div>

        // ==================== VẼ SVG SIÊU SÁNG RÕ RÀNG ====================

            const isLit = comp && isSimulating && comp.state.lit && !comp.state.error;
            const isBurned = comp && isSimulating && comp.state.error && comp.state.error.type === 'BURN';

                        <text x="14" y="72" fill="#dc2626" font-size="11" font-weight="900">+</text>
                        <text x="53" y="72" fill="#0f172a" font-size="11" font-weight="900">-</text>

                case 'resistor':
                    return `

                    </svg>`;

                case 'servo':

                    <svg viewBox="0 0 120 100" class="w-full h-full drop-shadow">

        let arduinoPinStates = {
            '13': 5, '12': 5, '11': 5, '10': 5, '9': 5, '8': 5,
            '7': 5, '6': 5, '5': 5, '4': 5, '3': 5, '2': 5
        };
        let loopCmds = [];
        let loopPtr = 0;
        let servoAngle = 90;
        let lcdTitle = 'TinkerSVG Ready!';

        // ==================== TAB & KHO LINH KIỆN ====================
        function togglePartsPanel() {
            const panel = document.getElementById('parts-panel');
            const icon = document.getElementById('panel-arrow-icon');
            if (panel.classList.contains('-ml-80')) {
                panel.classList.remove('-ml-80');
                icon.className = 'fa-solid fa-chevron-left text-sm';
            } else {
                panel.classList.add('-ml-80');
                icon.className = 'fa-solid fa-chevron-right text-sm';
            }
        }

        function cycleCategory(dir) {
            catIndex = (catIndex + dir + CATEGORIES.length) % CATEGORIES.length;
            document.getElementById('cat-title').innerText = CATEGORIES[catIndex].title;
            renderCatalog();
        }

        function renderCatalog() {
            const cat = CATEGORIES[catIndex].id;
            const q = (document.getElementById('search-box').value || '').toLowerCase();
            const grid = document.getElementById('catalog-grid');
            let html = '';

            Object.entries(PARTS).forEach(([type, info]) => {
                if (cat !== 'all' && info.cat !== cat) return;
                if (q && !info.name.toLowerCase().includes(q)) return;

                html += `
                    <div onclick="addPartToBoard('${type}')" 
                         class="bg-slate-50 hover:bg-blue-50 active:scale-95 border-2 border-slate-200 hover:border-blue-500 rounded-xl p-2 flex flex-col items-center justify-between cursor-pointer transition shadow-sm">
                        <div class="w-full h-16 flex items-center justify-center p-1 pointer-events-none">
                            ${generateDetailedSVG(type)}
                        </div>
                        <div class="text-[11px] font-extrabold text-slate-800 text-center mt-1 leading-tight">${info.name}</div>
                        <span class="mt-1 text-[10px] font-bold bg-blue-600 text-white px-2.5 py-0.5 rounded-full">+ Lấy ra bàn</span>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function showToast(msg) {
            const t = document.getElementById('toast-msg');
            document.getElementById('toast-text').innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000);
        }

        function addPartToBoard(type, customX = null, customY = null, customProps = {}) {
            const tpl = PARTS[type];
            const id = 'part_' + Date.now() + '_' + Math.floor(Math.random()*999);
            const offset = (components.length % 6) * 25;
            const comp = {
                id, type,
                name: tpl.name,
                x: customX !== null ? customX : 140 + offset,
                y: customY !== null ? customY : 90 + offset,
                props: Object.assign(JSON.parse(JSON.stringify(tpl.props || {})), customProps),
                pins: JSON.parse(JSON.stringify(tpl.pins)),
                state: { lit: false, currentMa: 0, error: null }
            };
            components.push(comp);
            selectedId = id;
            if (customX === null) showToast(`Đã thêm "${tpl.name}"!`);
            if (isSimulating) evaluateCircuit();
            else renderBoard();
            return comp;
        }

        // ==================== DI CHUYỂN NÚT BẤM ====================
        function nudgeSelected(dx, dy) {
            if (!selectedId) return;
            const c = components.find(x => x.id === selectedId);
            if (c) {
                c.x = Math.max(10, c.x + dx);
                c.y = Math.max(10, c.y + dy);
                renderBoard();
            }
        }

        function enableTapToPlace() {
            if (!selectedId) return;
            tapToPlaceMode = true;
            showToast('Chạm vào vị trí bất kỳ trên bàn vẽ để đặt linh kiện!');
        }

        function onWorkspaceClick(e) {
            if (tapToPlaceMode && selectedId) {
                const rect = document.getElementById('board-stage').getBoundingClientRect();
                const c = components.find(x => x.id === selectedId);
                if (c) {
                    const tpl = PARTS[c.type];
                    c.x = Math.max(10, Math.round(((e.clientX - rect.left) / zoom - tpl.w/2) / 10) * 10);
                    c.y = Math.max(10, Math.round(((e.clientY - rect.top) / zoom - tpl.h/2) / 10) * 10);
                }
                tapToPlaceMode = false;
                renderBoard();
                return;
            }
            activePin = null;
            selectedId = null;
            renderBoard();
        }

        function selectPart(e, id) {
            e.stopPropagation();
            if (tapToPlaceMode) return;
            selectedId = id;
            renderBoard();
        }

        // ==================== RENDER BÀN MẠCH & HIỆU ỨNG SÁNG ====================
        function renderBoard() {
            const container = document.getElementById('comp-container');
            container.className = `absolute inset-0 w-full h-full z-10 ${showAllPinTags ? 'show-all-pins' : ''}`;

            container.innerHTML = components.map(c => {
                const tpl = PARTS[c.type];
                const isSel = c.id === selectedId;
                const pinsHTML = c.pins.map(p => {
                    const isAct = activePin && activePin.compId === c.id && activePin.pinId === p.id;
                    return `
                        <div class="pin ${isAct ? 'pin-active' : ''}" 
                             style="left: ${p.x - 7}px; top: ${p.y - 7}px;"
                             onclick="onPinClick(event, '${c.id}', '${p.id}')">
                            <span class="pin-tag">${p.label}</span>
                        </div>
                    `;
                }).join('');

                // Huy hiệu báo ĐANG SÁNG hoặc BÁO LỖI CHÁY NỔ cực kỳ trực quan
                let badgeHTML = '';
                if (isSimulating && c.state.error) {
                    badgeHTML = `
                        <div class="smoke-cloud" style="left: 35%; top: -5px;"></div>
                        <button onclick="showErrorDetail('${c.id}', event)"
                                class="absolute -top-5 -right-4 bg-red-600 text-yellow-300 border-2 border-white px-2 py-0.5 rounded-full shadow-xl flex items-center space-x-1 z-50 animate-bounce text-[10px] font-extrabold">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span>CHÁY!</span>
                        </button>
                    `;
                } else if (isSimulating && c.state.lit && !['arduino_uno','arduino_nano','esp32','breadboard','resistor','battery9v','battery_aa','coin_cell'].includes(c.type)) {
                    badgeHTML = `
                        <div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-emerald-600 text-white border border-white px-2 py-0.5 rounded-full shadow-lg text-[10px] font-extrabold whitespace-nowrap z-40">
                            ⚡ SÁNG (${c.state.currentMa || 15}mA)
                        </div>
                    `;
                }

                let actionBtn = '';
                if (c.type === 'button' || c.type === 'slide_switch') {
                    const closed = c.type === 'button' ? c.props.pressed : c.props.on;
                    actionBtn = `
                        <button onclick="toggleSwitch('${c.id}', event)" 
                                class="absolute inset-4 rounded-full ${closed ? 'bg-emerald-500' : 'bg-red-600'} text-white font-extrabold text-[10px] shadow border-2 border-white z-30">
                            ${closed ? 'ON' : 'OFF'}
                        </button>
                    `;
                }

                return `
                    <div class="absolute ${isSel ? 'ring-4 ring-blue-500 rounded-xl bg-blue-50/30' : ''}"
                         style="left: ${c.x}px; top: ${c.y}px; width: ${tpl.w}px; height: ${tpl.h}px;"
                         onclick="selectPart(event, '${c.id}')">
                        ${badgeHTML}
                        ${generateDetailedSVG(c.type, c)}
                        ${actionBtn}
                        ${pinsHTML}
                    </div>
                `;
            }).join('');

            renderWires();
            updateMovePad();
            updateStatusBar();
        }

        function updateStatusBar() {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            if (!isSimulating) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-slate-400';
                txt.innerText = 'Đang tạm dừng. Bấm nút "Chạy" màu xanh góc phải trên để bật đèn!';
                return;
            }
            const errComp = components.find(c => c.state.error);
            const litComps = components.filter(c => c.state.lit);
            if (errComp) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-red-600 animate-ping';
                txt.innerText = `⚠️ Cảnh báo: ${errComp.state.error.title} (Bấm vào biểu tượng CHÁY! để xem)`;
            } else if (litComps.length > 0) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping';
                txt.innerText = `⚡ Mạch kín hợp lệ: Đang cấp điện cho ${litComps.map(x => x.name).join(', ')}!`;
            } else {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500';
                txt.innerText = 'Chưa khép kín mạch (Cần nối từ chân 5V/D13/Pin+ qua linh kiện rồi về chân GND/Pin-)';
            }
        }

        function updateMovePad() {
            const pad = document.getElementById('move-pad');
            if (!selectedId) { pad.classList.add('hidden'); return; }
            const c = components.find(x => x.id === selectedId);
            if (!c) return;

            pad.classList.remove('hidden');
            document.getElementById('sel-comp-name').innerText = c.name;
            const propBox = document.getElementById('sel-comp-props');

            if (c.type === 'resistor' || c.type === 'potentiometer') {
                propBox.innerHTML = `
                    <div class="flex items-center space-x-1">
                        <span class="text-[10px] font-bold">Trở (Ω):</span>
                        <input type="number" value="${c.props.resistance}" oninput="setCompProp('${c.id}', 'resistance', Number(this.value))"
                               class="w-16 border border-slate-300 rounded px-1 py-0.5 text-xs font-bold">
                    </div>`;
            } else if (c.type === 'led' || c.type === 'rgb_led') {
                propBox.innerHTML = `
                    <select onchange="setCompProp('${c.id}', 'color', this.value)" class="w-full border border-slate-300 rounded px-1 py-0.5 text-xs font-bold">
                        <option value="red" ${c.props.color==='red'?'selected':''}>Màu: Đỏ rực</option>
                        <option value="green" ${c.props.color==='green'?'selected':''}>Màu: Xanh lá</option>
                        <option value="yellow" ${c.props.color==='yellow'?'selected':''}>Màu: Vàng</option>
                        <option value="blue" ${c.props.color==='blue'?'selected':''}>Màu: Xanh dương</option>
                    </select>`;
            } else {
                propBox.innerHTML = `<span class="text-[10px] text-slate-500">Chạm chân đen để nối dây</span>`;
            }
        }

        function setCompProp(id, k, v) {
            const c = components.find(x => x.id === id);
            if (c) { c.props[k] = v; if (isSimulating) evaluateCircuit(); else renderBoard(); }
        }

        function toggleSwitch(id, e) {
            e.stopPropagation();
            const c = components.find(x => x.id === id);
            if (!c) return;
            if (c.type === 'button') c.props.pressed = !c.props.pressed;
            if (c.type === 'slide_switch') c.props.on = !c.props.on;
            if (isSimulating) evaluateCircuit();
            else renderBoard();
        }

        // ==================== NỐI DÂY ====================
        function onPinClick(e, compId, pinId) {
            e.stopPropagation();
            if (!activePin) {
                activePin = { compId, pinId };
                showToast('Chạm vào chân thứ 2 để nối dây!');
                renderBoard();
            } else {
                if (activePin.compId !== compId || activePin.pinId !== pinId) {
                    wires.push({
                        id: 'w_' + Date.now() + '_' + Math.floor(Math.random()*99),
                        fromComp: activePin.compId, fromPin: activePin.pinId,
                        toComp: compId, toPin: pinId,
                        color: wireColor
                    });
                    if (isSimulating) evaluateCircuit();
                }
                activePin = null;
                renderBoard();
            }
        }

        function getAbsPinPos(compId, pinId) {
            const c = components.find(x => x.id === compId);
            if (!c) return { x: 0, y: 0 };
            const p = c.pins.find(x => x.id === pinId);
            return p ? { x: c.x + p.x, y: c.y + p.y } : { x: 0, y: 0 };
        }

        function renderWires() {
            const svg = document.getElementById('wire-svg');
            svg.innerHTML = wires.map(w => {
                const p1 = getAbsPinPos(w.fromComp, w.fromPin);
                const p2 = getAbsPinPos(w.toComp, w.toPin);
                const cy = Math.max(p1.y, p2.y) + 25;
                const d = `M ${p1.x} ${p1.y} Q ${(p1.x+p2.x)/2} ${cy} ${p2.x} ${p2.y}`;
                return `<path d="${d}" stroke="${w.color}" stroke-width="5" fill="none" stroke-linecap="round"
                              class="pointer-events-auto cursor-pointer hover:opacity-70 ${isSimulating ? 'wire-active' : ''}"
                              onclick="deleteWire(event, '${w.id}')" title="Chạm để xóa dây"/>`;
            }).join('');
        }

        function deleteWire(e, id) {
            e.stopPropagation();
            wires = wires.filter(w => w.id !== id);
            if (isSimulating) evaluateCircuit();
            else renderBoard();
        }

        // ==================== GIẢI THUẬT VẬT LÝ MẠCH ĐIỆN (ĐẢM BẢO SÁNG 100% KHI KÍN MẠCH) ====================
        function evaluateCircuit() {
            components.forEach(c => { c.state.lit = false; c.state.currentMa = 0; c.state.error = null; });
            const adj = {};
            const addLink = (u, v, type = 'wire', comp = null) => {
                if (!adj[u]) adj[u] = [];
                if (!adj[v]) adj[v] = [];
                adj[u].push({ to: v, type, comp });
                adj[v].push({ to: u, type, comp });
            };

            // 1. Dây nối ngoài
            wires.forEach(w => addLink(`${w.fromComp}:${w.fromPin}`, `${w.toComp}:${w.toPin}`));

            // 2. Nội bộ từng linh kiện (Nối thông 2 đầu tải để dòng điện chạy qua dễ dàng)
            components.forEach(c => {
                if (c.type === 'breadboard') {
                    const groups = {};
                    c.pins.forEach(p => { if (!groups[p.g]) groups[p.g] = []; groups[p.g].push(`${c.id}:${p.id}`); });
                    Object.values(groups).forEach(arr => {
                        for (let i=0; i<arr.length; i++)
                            for (let j=i+1; j<arr.length; j++) addLink(arr[i], arr[j]);
                    });
                }
                else if (c.type === 'button') {
                    addLink(`${c.id}:1A`, `${c.id}:1B`);
                    addLink(`${c.id}:2A`, `${c.id}:2B`);
                    if (c.props.pressed) addLink(`${c.id}:1A`, `${c.id}:2A`);
                }
                else if (c.type === 'slide_switch' && c.props.on) {
                    addLink(`${c.id}:1A`, `${c.id}:2A`);
                    addLink(`${c.id}:2A`, `${c.id}:3A`);
                }
                else if (c.type === 'resistor' || c.type === 'ldr') {
                    addLink(`${c.id}:T1`, `${c.id}:T2`, 'resistor', c);
                }
                else if (c.type === 'potentiometer') {
                    addLink(`${c.id}:T1`, `${c.id}:W`, 'resistor', c);
                    addLink(`${c.id}:W`, `${c.id}:T2`, 'resistor', c);
                }
                else if (!['arduino_uno','arduino_nano','esp32','battery9v','battery_aa','coin_cell'].includes(c.type)) {
                    // Liên kết mọi chân Dương/Tín hiệu với chân Âm của Linh kiện Đầu ra (LED, Motor, LCD, Còi...)
                    for (let i = 0; i < c.pins.length; i++) {
                        for (let j = i + 1; j < c.pins.length; j++) {
                            addLink(`${c.id}:${c.pins[i].id}`, `${c.id}:${c.pins[j].id}`, 'load', c);
                        }
                    }
                }
            });

            // 3. Nguồn Dương (5V, 3.3V, VIN, D2-D13, A0-A5, Pin+) và Nguồn Âm (GND, Pin-)
            const sources = [];
            const grounds = new Set();

            components.forEach(c => {
                if (['arduino_uno', 'arduino_nano', 'esp32'].includes(c.type)) {
                    ['GND1','GND2','GND3'].forEach(g => grounds.add(`${c.id}:${g}`));
                    sources.push({ node: `${c.id}:5V`, v: 5, comp: c, label: '5V ' + c.name });
                    sources.push({ node: `${c.id}:3V3`, v: 3.3, comp: c, label: '3.3V ' + c.name });
                    sources.push({ node: `${c.id}:VIN`, v: 5, comp: c, label: 'VIN ' + c.name });
                    ['13','12','11','10','9','8','7','6','5','4','3','2','A0','A1','A2','A3','A4','A5'].forEach(p => {
                        const vOut = (arduinoPinStates[p] !== undefined) ? arduinoPinStates[p] : 5;
                        if (vOut > 0) {
                            sources.push({ node: `${c.id}:${p}`, v: vOut, comp: c, label: `Chân D${p}` });
                        } else {
                            grounds.add(`${c.id}:${p}`);
                        }
                    });
                } else if (['battery9v', 'battery_aa', 'coin_cell'].includes(c.type)) {
                    sources.push({ node: `${c.id}:POS`, v: c.props.voltage, comp: c, label: c.name });
                    grounds.add(`${c.id}:NEG`);
                }
            });

            // 4. Tìm đường mạch kín từ Nguồn -> Tải -> GND
            sources.forEach(src => {
                const q = [{ curr: src.node, vis: new Set([src.node]), res: [], loads: [] }];
                while (q.length > 0) {
                    const p = q.shift();
                    if (grounds.has(p.curr)) {
                        const uniqRes = [...new Set(p.res)];
                        const uniqLoads = [...new Set(p.loads)];
                        const totalR = uniqRes.reduce((s, r) => s + (r.props.resistance || 0), 0);

                        if (totalR === 0 && uniqLoads.length === 0) {
                            src.comp.state.error = {
                                type: 'SHORT',
                                title: 'CHẬP MẠCH NGUỒN (SHORT CIRCUIT)!',
                                desc: `${src.label} (${src.v}V) nối thẳng trực tiếp xuống GND không qua linh kiện tiêu thụ nào, gây cháy mạch nguồn!`,
                                fix: 'Xóa ngay sợi dây nối tắt giữa chân Dương (5V/Pin+) và chân GND.'
                            };
                        }

                        uniqLoads.forEach(ld => {
                            if (ld.type === 'led' && totalR === 0 && src.v >= 4.5) {
                                ld.state.error = {
                                    type: 'BURN',
                                    title: 'CHÁY ĐÈN LED DO KHÔNG CÓ ĐIỆN TRỞ!',
                                    desc: `Đèn LED nối trực tiếp vào nguồn ${src.v}V không qua điện trở hạn dòng khiến dòng điện vọt lên >200mA (vượt quá giới hạn 20mA của LED).`,
                                    fix: 'Mắc nối tiếp 1 Điện trở (220Ω - 1000Ω) vào mạch đèn LED.'
                                };
                            } else {
                                const calcMa = ((Math.max(1, src.v - 1.8) / Math.max(100, totalR)) * 1000).toFixed(1);
                                ld.state.lit = true;
                                ld.state.currentMa = calcMa;
                            }
                        });
                        continue;
                    }
                    (adj[p.curr] || []).forEach(e => {
                        if (!p.vis.has(e.to)) {
                            const nv = new Set(p.vis); nv.add(e.to);
                            const nr = [...p.res]; const nl = [...p.loads];
                            if (e.type === 'resistor') nr.push(e.comp);
                            if (e.type === 'load') nl.push(e.comp);
                            q.push({ curr: e.to, vis: nv, res: nr, loads: nl });
                        }
                    });
                }
            });

            renderBoard();
        }

        // ==================== CHẠY MÔ PHỎNG & PRESETS ====================
        function toggleSim(forceStart = false) {
            isSimulating = forceStart ? true : !isSimulating;
            const btn = document.getElementById('btn-sim');
            const icon = document.getElementById('sim-icon');
            const txt = document.getElementById('sim-text');

            clearTimeout(simTimer);

            if (isSimulating) {
                btn.classList.replace('bg-emerald-600', 'bg-red-600');
                icon.className = 'fa-solid fa-stop';
                txt.innerText = 'Dừng';
                compileArduino();
                evaluateCircuit();
                runArduinoLoop();
            } else {
                btn.classList.replace('bg-red-600', 'bg-emerald-600');
                icon.className = 'fa-solid fa-play';
                txt.innerText = 'Chạy';
                components.forEach(c => { c.state.lit = false; c.state.error = null; });
                renderBoard();
            }
        }

        function compileArduino() {
            const code = document.getElementById('code-editor').value;
            // Mặc định cấp 5V cho các chân để lắp mạch nào cũng sáng ngay
            arduinoPinStates = {
                '13': 5, '12': 5, '11': 5, '10': 5, '9': 5, '8': 5,
                '7': 5, '6': 5, '5': 5, '4': 5, '3': 5, '2': 5
            };
            loopCmds = [];
            const lcdM = code.match(/lcd\.print\s*\(\s*"([^"]*)"\s*\)/);
            if (lcdM) lcdTitle = lcdM[1];

            code.split('\n').forEach(l => {
                let dw = l.match(/digitalWrite\s*\(\s*(\d+)\s*,\s*(HIGH\vert{}LOW)\s*\)/);
                if (dw) loopCmds.push({ t: 'dw', pin: dw[1], v: dw[2] === 'HIGH' ? 5 : 0 });
                let sv = l.match(/servo\.write\s*\(\s*(\d+)\s*\)/);
                if (sv) loopCmds.push({ t: 'sv', ang: parseInt(sv[1]) });
                let sp = l.match(/Serial\.println\s*\(\s*"([^"]*)"\s*\)/);
                if (sp) loopCmds.push({ t: 'sp', msg: sp[1] });
                let dl = l.match(/delay\s*\(\s*(\d+)\s*\)/);
                if (dl) loopCmds.push({ t: 'dl', ms: parseInt(dl[1]) });
            });
        }

        function runArduinoLoop() {
            loopPtr = 0;
            const step = () => {
                if (!isSimulating || loopCmds.length === 0) return;
                const cmd = loopCmds[loopPtr];
                loopPtr = (loopPtr + 1) % loopCmds.length;
                if (cmd.t === 'dw') { arduinoPinStates[cmd.pin] = cmd.v; evaluateCircuit(); simTimer = setTimeout(step, 30); }
                else if (cmd.t === 'sv') { servoAngle = cmd.ang; renderBoard(); simTimer = setTimeout(step, 30); }
                else if (cmd.t === 'sp') {
                    const box = document.getElementById('serial-box');
                    box.innerHTML += `<div>&gt; ${cmd.msg}</div>`;
                    box.scrollTop = box.scrollHeight;
                    simTimer = setTimeout(step, 30);
                }
                else if (cmd.t === 'dl') { simTimer = setTimeout(step, cmd.ms); }
            };
            step();
        }

        function showErrorDetail(id, e) {
            e.stopPropagation();
            const c = components.find(x => x.id === id);
            if (!c || !c.state.error) return;
            document.getElementById('err-title').innerText = c.state.error.title;
            document.getElementById('err-desc').innerText = c.state.error.desc;
            document.getElementById('err-fix').innerText = c.state.error.fix;
            document.getElementById('err-modal').classList.remove('hidden');
        }

        function togglePinLabels() { showAllPinTags = !showAllPinTags; renderBoard(); }

        function rotateSelected() {
            if (!selectedId) return;
            const c = components.find(x => x.id === selectedId);
            if (c) { c.pins.forEach(p => { const t = p.x; p.x = p.y; p.y = t; }); renderBoard(); }
        }

        function deleteSelected() {
            if (!selectedId) return;
            components = components.filter(c => c.id !== selectedId);
            wires = wires.filter(w => w.fromComp !== selectedId && w.toComp !== selectedId);
            selectedId = null;
            if (isSimulating) evaluateCircuit();
            else renderBoard();
        }

        function setWireColor(c) {
            wireColor = c;
            document.querySelectorAll('.swatch').forEach(b => {
                b.className = `w-4 h-4 rounded-full swatch ${b.dataset.c === c ? 'ring-2 ring-blue-600 scale-125' : ''}`;
                b.style.backgroundColor = b.dataset.c;
            });
        }

        function setZoom(d) {
            zoom = Math.min(1.5, Math.max(0.5, +(zoom + d).toFixed(2)));
            document.getElementById('board-stage').style.transform = `scale(${zoom})`;
            document.getElementById('zoom-val').innerText = Math.round(zoom * 100) + '%';
        }

        function toggleCodeDrawer() {
            const d = document.getElementById('code-drawer');
            d.classList.toggle('hidden');
            d.classList.toggle('flex');
        }

        function loadPreset(p) {
            components = []; wires = []; selectedId = null;

            if (p === 'safe') {
                const ard = addPartToBoard('arduino_uno', 30, 80);
                const res = addPartToBoard('resistor', 320, 75, { resistance: 220 });
                const led = addPartToBoard('led', 460, 45, { color: 'red' });
                wires.push(
                    { id: 'w1', fromComp: ard.id, fromPin: '13', toComp: res.id, toPin: 'T1', color: '#10b981' },
                    { id: 'w2', fromComp: res.id, fromPin: 'T2', toComp: led.id, toPin: 'A', color: '#ef4444' },
                    { id: 'w3', fromComp: led.id, fromPin: 'C', toComp: ard.id, toPin: 'GND1', color: '#0f172a' }
                );
            } else if (p === 'battery_led') {
                const bat = addPartToBoard('battery9v', 80, 100);
                const res = addPartToBoard('resistor', 220, 95, { resistance: 330 });
                const led = addPartToBoard('led', 370, 75, { color: 'green' });
                wires.push(
                    { id: 'w1', fromComp: bat.id, fromPin: 'POS', toComp: res.id, toPin: 'T1', color: '#ef4444' },
                    { id: 'w2', fromComp: res.id, fromPin: 'T2', toComp: led.id, toPin: 'A', color: '#10b981' },
                    { id: 'w3', fromComp: led.id, fromPin: 'C', toComp: bat.id, toPin: 'NEG', color: '#0f172a' }
                );
            } else if (p === 'burn') {
                const ard = addPartToBoard('arduino_uno', 30, 80);
                const led = addPartToBoard('led', 340, 50, { color: 'red' });
                wires.push(
                    { id: 'w1', fromComp: ard.id, fromPin: '5V', toComp: led.id, toPin: 'A', color: '#ef4444' },
                    { id: 'w2', fromComp: led.id, fromPin: 'C', toComp: ard.id, toPin: 'GND2', color: '#0f172a' }
                );
            } else if (p === 'short') {
                const ard = addPartToBoard('arduino_uno', 30, 80);
                wires.push({ id: 'w1', fromComp: ard.id, fromPin: '5V', toComp: ard.id, toPin: 'GND2', color: '#ef4444' });
            } else if (p === 'full') {
                const ard = addPartToBoard('arduino_uno', 30, 80);
                const lcd = addPartToBoard('lcd16x2', 320, 40);
                const mot = addPartToBoard('dc_motor', 320, 180);
                const sv = addPartToBoard('servo', 460, 175);
                wires.push(
                    { id: 'w1', fromComp: ard.id, fromPin: '5V', toComp: lcd.id, toPin: 'VCC', color: '#ef4444' },
                    { id: 'w2', fromComp: ard.id, fromPin: 'GND2', toComp: lcd.id, toPin: 'GND', color: '#0f172a' },
                    { id: 'w3', fromComp: ard.id, fromPin: '5V', toComp: mot.id, toPin: 'T1', color: '#ef4444' },
                    { id: 'w4', fromComp: ard.id, fromPin: 'GND3', toComp: mot.id, toPin: 'T2', color: '#0f172a' },
                    { id: 'w5', fromComp: ard.id, fromPin: '13', toComp: sv.id, toPin: 'SIG', color: '#f59e0b' },
                    { id: 'w6', fromComp: ard.id, fromPin: 'GND1', toComp: sv.id, toPin: 'GND', color: '#0f172a' }
                );
            }
            selectedId = null;
            // Tự động bật mô phỏng ngay lập tức để thấy đèn sáng luôn
            toggleSim(true);
        }

        window.onload = () => {
            renderCatalog();
            // Trên màn hình nhỏ tự động đóng gọn thanh linh kiện bên trái để nhìn rõ đèn LED sáng
            if (window.innerWidth < 640) togglePartsPanel();
            loadPreset('safe');
        };
    </script>
</body>
</html>
